name: Frontend CI/CD

on:
  push:
    branches: [ main, test-devops ]
  pull_request:
    branches: [ main, test-devops ]

jobs:
  test_and_build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes
        run: npm test --if-present

      - name: Build do frontend
        run: npm run build

      - name: Upload dos artefatos
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist
          retention-days: 5

  deploy:
    runs-on: ubuntu-latest
    needs: test_and_build
    if: github.ref == 'refs/heads/main'
    environment:
      name: homolog

    permissions:
      contents: write

    steps:
      - name: Checkout novamente para deploy
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Build novamente para deploy
        run: npm run build

      - name: Deploy no GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
